</style><link rel="stylesheet" href="editorial-refinement.css"><link rel="stylesheet" href="editorial-cast.css"><body data-version="1"><header><img src="assets/logo.png" alt="PixtoLearn"><span>Design study · App page</span></header><div class="review"><p>Seis direcciones · Mismo producto, distintas maneras de presentarlo</p><nav class="versions" aria-label="Design directions"></nav></div><div class="comment" id="comment"></div><main><div class="intro"><div class="eyebrow">The PixtoLearn app</div><h1>Everyday possibilities.<br><em>Made visual.</em></h1><p>Routines, swimming, movement and communication. Prepared by you, ready for them.</p></div><nav class="topics" aria-label="App presentation"></nav><section class="product"><nav class="areas" aria-label="Product areas"></nav><div class="stage"></div></section><div class="bottom"><span>For families and individual professionals.</span><a class="cta" href="shop.html#digital-app">Choose your plan</a></div></main><script>
const names=['Signature','Studio','Deep blue','Editorial','Product story','Workspace'];const notes=['Equilibrio de marca: visual a la izquierda, funciones conectadas a la derecha.','Navegación lateral: separa claramente las áreas y la personalización.','Azul profundo: presencia de marca y contraste, con el producto iluminado.','Editorial: tipografía protagonista, espacio y composición de producto.','Product story: información primero, visual enmarcado y controles más precisos.','Workspace · Recomendada: navegación unificada, colores por área y una superficie flotante.'];
let version=1,topic=0,area=0,mode='adult',feature=0;
const products=[['routines','Routines','#ce3862','#faedf0'],['swimming','Swimming','#507f8d','#edf4f5'],['physical','Physical Activity','#bd7029','#fbf0e5'],['voice','My Voice','#7a4e9a','#f2ecf6']];
const info=[['Choose a starting point','Browse the routine library and open a saved routine.'],['Make it personal','Create your own routine and use the Lab to make cards for everyday moments.'],['Share what is ready','Send the prepared routine to the user dashboard or weekly schedule.']];
function nav(){document.querySelector('.versions').innerHTML=names.map((n,i)=>`<button aria-pressed="${version===i+1}" onclick="version=${i+1};document.body.dataset.version=version;nav();render()">${i+1} · ${n}</button>`).join('');document.querySelector('#comment').textContent=notes[version-1];}
function render(){let [key,label,c,t]=products[area];document.querySelector('main').style.cssText=`--accent:${c};--tint:${t}`;document.querySelector('.topics').innerHTML=['Inside the app','Adult & User','Languages','Characters'].map((n,i)=>`<button role="tab" aria-selected="${topic===i}" onclick="topic=${i};render()">${n}</button>`).join('');document.querySelector('.areas').style.display=topic===0?'':'none';document.querySelector('.areas').innerHTML=products.map((p,i)=>`<button style="--c:${p[2]}" aria-pressed="${area===i}" onclick="area=${i};feature=0;render()">${p[1]}</button>`).join('');let entries=topic===1?[['Your four areas','Move between routines, swimming, physical activity and communication.'],['Your weekly plan','Prepare a visual schedule and share it with the user.'],['Personalisation','Choose language and visual preferences from adult controls.']]:area===0?info:area===1?[['Swimming library','Discover water adaptation, floating, strokes, games and supporting visuals.'],['Sessions & circuits','Prepare activities in a sequence or arrange them into stations.'],['Ready to share','Keep your plans and send them to the user dashboard.']]:area===2?[['Movement library','Find activities with and without equipment.'],['Prepare a plan','Arrange a session or circuit around the learner.'],['Take part','Share the prepared activities for the user to follow.']]:[['Your communication space','Open My Voice from the adult home.'],['Words & boards','Prepare vocabulary and boards around the person.'],['Everyday communication','Use pictures and ready phrases in Focus Mode.']];if(mode==='child')entries=[['Their own dashboard','Find the activities and support made available by the adult.'],['Ready to take part','Open the prepared activity and follow the visual sequence.'],['At their pace','Use focused views and visual support for each step.']];let src=topic===1?(mode==='adult'?'voice-adult-portrait':'child-home-portrait'):`${key}-${mode}-portrait`;
if(topic<2){document.querySelector('.stage').innerHTML=`<div class="visual"><div class="tablet"><img src="assets/current-art/${src}.png" alt="Actual PixtoLearn ${label} ${mode==='adult'?'adult':'user'} dashboard"><button class="hotspot" style="--x:80%;--y:24%" aria-label="Explain the dashboard" aria-pressed="${feature===0}" onclick="feature=0;render()">1</button><button class="hotspot" style="--x:80%;--y:48%" aria-label="Explain prepared activities" aria-pressed="${feature===1}" onclick="feature=1;render()">2</button><button class="hotspot" style="--x:80%;--y:87%" aria-label="Explain participation" aria-pressed="${feature===2}" onclick="feature=2;render()">3</button></div></div><div class="copy"><div class="eyebrow">${topic===1?'Two connected spaces':label}</div><h2>${topic===1?'You prepare.<br>They take part.':label==='My Voice'?'A way to be heard.':'A clear place to begin.'}</h2><div class="role"><button aria-pressed="${mode==='adult'}" onclick="mode='adult';feature=0;render()">Adult dashboard</button><button aria-pressed="${mode==='child'}" onclick="mode='child';feature=0;render()">User dashboard</button></div>${entries.map((p,i)=>`<button class="feature" aria-expanded="${feature===i}" onclick="feature=${i};render()"><span>${i+1}</span>${p[0]}</button>${feature===i?`<p class="detail">${p[1]}</p>`:''}`).join('')}<p class="hint">Select a marker or a feature to find out more.</p></div>`}else if(topic===2){document.querySelector('.stage').innerHTML=`<div class="alternate"><div class="altcopy"><div class="eyebrow">Across all four areas</div><h2>Familiar pictures.<br>Your language.</h2><p>One language choice, throughout your everyday visual support.</p></div><div class="cards">${['hairdresser','swimming-1-main','physical-1-main','voice-help'].map(k=>`<div class="frame"><iframe title="Original ${k} card" src="assets/current-art/fan-${k}.html"></iframe></div>`).join('')}</div></div>`}else{document.querySelector('.stage').innerHTML=`<div class="alternate"><div class="altcopy"><div class="eyebrow">Representation matters</div><h2>Different people.<br>Shared possibilities.</h2><p>Meet the PixtoLearn characters.</p><label>Preview a skin tone <select onchange="document.querySelector('.cast').src='assets/cast/ensemble-'+this.value+'.png'"><option value="light">Light</option><option value="medium">Medium</option><option value="dark">Dark</option></select></label></div><img class="cast" src="assets/cast/ensemble-light.png" alt="The sixteen PixtoLearn characters"></div>`}}
nav();render();
