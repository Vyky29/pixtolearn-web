<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>More like B</title>
  <style>
    body { margin: 0; font-family: Figtree, system-ui, sans-serif; background: #14242b; color: #fff; padding: 1.5rem; }
    h1 { font-size: 1.15rem; margin: 0 0 0.35rem; }
    .sub { opacity: 0.7; font-size: 0.9rem; margin: 0 0 1.25rem; max-width: 40rem; }
    h2 { font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.55; margin: 1.5rem 0 0.75rem; }
    .grid { display: grid; gap: 1.25rem; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); max-width: 1100px; }
    figure { margin: 0; }
    img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 14px; display: block; background: #1e333c; }
    figcaption { margin-top: 0.55rem; font-size: 0.95rem; font-weight: 700; }
    p { margin: 0.25rem 0 0; font-size: 0.82rem; opacity: 0.7; }
    .tag { display: inline-block; margin-top: 0.35rem; font-size: 0.72rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: #b7ece7; }
    .tag.warn { color: #f0b040; }
  </style>
</head>
<body>
  <h1>More like B (cards in the pool)</h1>
  <p class="sub">Only a few product-in-water shots exist in the library. Here’s everything in that family.</p>

  <h2>No people</h2>
  <div class="grid">
    <figure>
      <img src="assets/photos/mode/product-three-alt.jpg" alt="B" />
      <figcaption>B — Your pick style</figcaption>
      <p>product-three-alt.jpg</p>
      <span class="tag">No people</span>
    </figure>
    <figure>
      <img src="assets/photos/mode/product-three-cards.jpg" alt="A" />
      <figcaption>A — Same shoot, wider</figcaption>
      <p>product-three-cards.jpg</p>
      <span class="tag">No people</span>
    </figure>
  </div>

  <h2>Same shoot family — hand in frame</h2>
  <div class="grid">
    <figure>
      <img src="assets/photos/mode/product-float.jpg" alt="D" />
      <figcaption>D — Single card floating</figcaption>
      <p>product-float.jpg</p>
      <span class="tag warn">Hand at top</span>
    </figure>
    <figure>
      <img src="assets/photos/mode/product-waterline.jpg" alt="E" />
      <figcaption>E — Card at waterline</figcaption>
      <p>product-waterline.jpg</p>
      <span class="tag warn">Hand holding card</span>
    </figure>
  </div>
</body>
</html>
