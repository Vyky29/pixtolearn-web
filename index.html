<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PixtoLearn | Launching soon</title>
  <meta name="description" content="One clear visual system. Swimming. Everyday cards. App. Academy. Keep me posted for launch." />
  <meta name="robots" content="index, follow" />
  <link rel="icon" href="assets/brand/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/site.css?v=academy-lock-1" />
</head>
<body class="launch-page" data-launch-page>
  <a class="skip" href="#main">Skip to content</a>

  <header class="launch-top">
    <div class="wrap launch-top-inner">
      <p class="launch-eyebrow">
        Launching soon<span class="launch-dots" aria-hidden="true"><span>.</span><span>.</span><span>.</span></span>
      </p>
    </div>
  </header>

  <main id="main">
    <section class="launch-hero">
      <div class="launch-hero-media" aria-hidden="true">
        <img src="assets/photos/mode/product-three-alt.jpg" alt="" />
        <div class="launch-hero-shade"></div>
      </div>

      <div class="launch-panel">
        <div class="launch-panel-scrim" aria-hidden="true"></div>

        <div class="launch-mid">
          <div class="launch-brand-halo">
            <span class="launch-halo-ring" aria-hidden="true"></span>
            <div class="launch-brand-circle">
              <img
                class="launch-logo-circle"
                src="assets/brand/logo-slogan.png"
                width="1024"
                height="721"
                alt="PixtoLearn — Because visuals speak louder"
              />
            </div>
          </div>
          <h1 class="launch-headline">One clear visual system.</h1>
          <p class="launch-sub">
            <span>Swimming.</span>
            <span>Everyday cards.</span>
            <span>App.</span>
            <span>Academy.</span>
          </p>
        </div>

        <div class="launch-lower">
          <form
            class="launch-form"
            data-launch-notify
            data-endpoint=""
            novalidate
          >
            <label class="visually-hidden" for="launch-email">Email</label>
            <div class="launch-form-pill">
              <input
                id="launch-email"
                type="email"
                name="email"
                required
                autocomplete="email"
                inputmode="email"
                placeholder="Your email"
              />
              <button class="launch-form-submit" type="submit">Keep me posted</button>
            </div>
            <input class="launch-hp" type="text" name="company" tabindex="-1" autocomplete="off" aria-hidden="true" />
            <p class="launch-form-note" data-launch-note>Launch note only. No spam.</p>
          </form>
        </div>
      </div>
    </section>
  </main>

  <footer class="launch-foot">
    <div class="wrap launch-foot-inner">
      <span>&copy; 2026 PixtoLearn</span>
      <a href="mailto:hello@pixtolearn.com">hello@pixtolearn.com</a>
    </div>
  </footer>

  <script src="js/launch-notify.js"></script>
</body>
</html>
